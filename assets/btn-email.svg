<svg xmlns="http://www.w3.org/2000/svg" width="347" height="46" viewBox="0 0 347 46" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.fade{opacity:0;animation:fade .5s ease forwards}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes fade{to{opacity:1}}
