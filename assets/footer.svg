<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
text{font-family:'JetBrains Mono','Fira Code','Cascadia Code','SF Mono',Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;}
.blink{animation:blink 1.1s steps(1) infinite}
.pulse{animation:pulse 2s ease-in-out infinite}
.fade{opacity:0;animation:fade .5s ease forwards}
@keyframes blink{50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes fade{to{opacity:1}}
</style><line x1="0" y1="20" x2="1000" y2="20" stroke="#1F252B" stroke-dasharray="4 6"/><text x="500.0" y="58" font-size="15" text-anchor="middle" xml:space="preserve"><tspan fill="#6E7681">// EOF</tspan><tspan fill="#1F252B">  ·  </tspan><tspan fill="#B3E625" font-weight="700">exit 0</tspan><tspan fill="#1F252B">  ·  </tspan><tspan fill="#6E7681">let us automate something</tspan><tspan class="blink" fill="#B3E625"> █</tspan></text></svg>